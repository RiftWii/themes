#
# On every push to main: check the themes again, zip each one
# deterministically, write themes.json and deploy it all to GitHub Pages.
# The repository's Settings > Pages source must be "GitHub Actions".
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  RIFTWII_REPO: KakarottoCake/Riftwii
  RIFTWII_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out RiftWii's theme parser
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RIFTWII_REPO }}
          ref: ${{ env.RIFTWII_REF }}
          path: riftwii
          persist-credentials: false
          sparse-checkout: |
            src/art/theme.cpp
            include/riftwii/theme.hpp
          sparse-checkout-cone-mode: false

      - name: Build theme_check
        run: sh scripts/build_theme_check.sh riftwii "$RUNNER_TEMP/theme_check"

      # Merged themes passed validate.yml, but RiftWii's rules may have
      # changed since (a new RIFTWII_REF); never publish a theme that would
      # now fail.
      - name: Validate every theme
        run: >
          python3 -I scripts/validate_theme.py
          --theme-check "$RUNNER_TEMP/theme_check"
          --flagged scripts/flagged-sha256.txt
          --approved scripts/approved-licenses.txt
          --all themes

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # themes.json's URLs come from site-url.txt, not from where Pages
      # happens to serve this copy, so a fork's publish can't silently
      # point RiftWii somewhere else. Warn when the two disagree.
      - name: Compare site-url.txt with the Pages URL
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          expected="$(tr -d '[:space:]' < site-url.txt)"
          if [ "${expected%/}" != "${PAGES_URL%/}" ]; then
            echo "::warning::site-url.txt says $expected but Pages serves this repository at $PAGES_URL"
          fi

      # Pillow, pinned, in a virtual environment of its own (the runner's
      # Python refuses system-wide pip installs). It only draws the mock
      # previews; if this step failed the build would still publish, using
      # backgrounds (build_index.py warns).
      - name: Install Pillow for the mock previews
        run: |
          python3 -m venv "$RUNNER_TEMP/preview-venv"
          "$RUNNER_TEMP/preview-venv/bin/pip" install --no-cache-dir --requirement scripts/requirements-preview.txt

      # A theme's preview is a mock of RiftWii's Home drawn with the theme's
      # pictures and colors (scripts/mock_preview.py), else its background.png
      # if drawing fails (build_index.py).
      - name: Build zips and themes.json
        run: >
          "$RUNNER_TEMP/preview-venv/bin/python" -I scripts/build_index.py
          --theme-check "$RUNNER_TEMP/theme_check"
          --themes themes
          --out site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
