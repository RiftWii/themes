#
# Checks every pull request: the description's tick boxes, and every theme
# folder against RiftWii's own rules (README.md, "What the check does").
#
# Safety: this runs on pull_request, not pull_request_target, so it gets a
# read-only token and no secrets. The scripts it runs come from the base
# branch (trusted/), never from the pull request (pr/), so a submission
# can't change the checks that judge it; the pull request's files are only
# read as data.
name: validate

on:
  pull_request:
    # "edited" so ticking the boxes in the description runs the check again.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  # To list the pull request's files (still read-only).
  pull-requests: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The RiftWii revision whose theme parser and picture list the themes are
  # checked against. TODO for the maintainers: main, or the latest release
  # tag (see README.md, "Open questions").
  RIFTWII_REPO: KakarottoCake/Riftwii
  RIFTWII_REF: main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the checks (base branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          path: pr
          persist-credentials: false

      - name: Check out RiftWii's theme parser
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RIFTWII_REPO }}
          ref: ${{ env.RIFTWII_REF }}
          path: riftwii
          persist-credentials: false
          # theme.cpp needs only its header, so skip the rest of the repo.
          sparse-checkout: |
            src/art/theme.cpp
            include/riftwii/theme.hpp
          sparse-checkout-cone-mode: false

      - name: Build theme_check
        run: sh trusted/scripts/build_theme_check.sh riftwii "$RUNNER_TEMP/theme_check"

      # Whether the pull request touches themes/ is asked of GitHub (with the
      # read-only token), not read from the pull request's files or text, so
      # it can't be talked out of the boxes. A renamed file lists its old
      # name too, so moving a file out of themes/ counts.
      - name: List the files the pull request changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api --paginate
          "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files"
          --jq '.[] | .filename, (.previous_filename // empty)'
          > "$RUNNER_TEMP/changed-files.txt"

      - name: Tick boxes in the description
        run: >
          python3 -I trusted/scripts/check_pr_body.py
          --template trusted/.github/PULL_REQUEST_TEMPLATE.md
          --event "$GITHUB_EVENT_PATH"
          --changed-files "$RUNNER_TEMP/changed-files.txt"

      # The scripts' own tests, from the base branch like the scripts.
      # With Pillow (pinned, as publish.yml installs it) so the mock-preview
      # tests run too; they skip themselves when it is missing. A pull request
      # that adds the tests or the requirements file has neither on the base
      # branch yet, so the step says so and skips until that change is merged.
      - name: Script tests
        run: |
          if [ ! -d trusted/tests ] || [ ! -f trusted/scripts/requirements-preview.txt ]; then
            echo "::notice::The script tests are not on the base branch yet; they run once this change is merged."
            exit 0
          fi
          python3 -m venv "$RUNNER_TEMP/preview-venv"
          "$RUNNER_TEMP/preview-venv/bin/pip" install --no-cache-dir --requirement trusted/scripts/requirements-preview.txt
          "$RUNNER_TEMP/preview-venv/bin/python" -I -m unittest discover -s trusted/tests

      - name: Theme folders
        run: >
          python3 -I trusted/scripts/validate_theme.py
          --theme-check "$RUNNER_TEMP/theme_check"
          --flagged trusted/scripts/flagged-sha256.txt
          --approved trusted/scripts/approved-licenses.txt
          --all pr/themes
