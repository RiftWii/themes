[theme]
name = Vaporwave
author = RiftWii contributors

[shape]
# Soft glass panels over a neon sunset.
corners = 0.8
gloss = yes
bar = dip
shelf_grain = no
home_menu = wii

[backdrop]
# backdrop_00.png to backdrop_19.png: the grid rolls toward you, one row a
# loop. RiftWii versions without looping backdrops show background.png.
stripes = no
frames = 20
fps = 12

[colors]
# Text: white and pale pink, cyan for what is lit
ink = #FDF0FF
ink_soft = #F3C9F0
ink_dim = #C99BD8
clock = #FFD2F4
accent = #FF4FD8
accent_ink = #6FF7FF
text_on_accent = #1A0530
warn = #FF6B6B

# Dark violet glass, a little of the sunset showing through
card = #2A0E4AE6
card_edge = #8B3FD9
card_edge_strong = #C26BFF
shadow = #00000088
glow = #FF4FD870
glyph = #F7D6FF

# Option chips and switches
chip_on = #4C1A6E
chip_off = #24093F
chip_off_edge = #6A2EA0
switch_off = #3B1460

# Background and bars
bar = #1E0838
backdrop = #0D0221
backdrop_stripe = #0D0221
banner_stripe = #FFFFFF14
# The games' own colours, a little toward violet
banner_tint = #2A0A4A59

# Lists and badges
divider = #4A1F70
scroll_track = #1E0838
scroll_thumb = #B04FE0
badge = #3B1460
shelf = #6A2EA0
shelf_edge = #3B1460

# Player pointers
pointer1 = #3B8FD6
pointer2 = #E05252
pointer3 = #48B858
pointer4 = #E5AC24
