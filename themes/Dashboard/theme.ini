[theme]
name = Dashboard
author = RiftWii contributors

[shape]
# Rounded glass, its own gloss drawn in the pictures.
corners = 0.9
gloss = no
bar = dip
shelf_grain = no
home_menu = wii

[colors]
# Text: white, and pale greens for the quieter levels
ink = #FFFFFF
ink_soft = #E2F4D6
ink_dim = #C2E2AE
clock = #FFFFFF
# Lime marks what is lit; its text is dark
accent = #9BE65A
accent_ink = #CBF5A0
text_on_accent = #10300A
warn = #FFB4A8

# Green glass tiles, buttons and panels
card = #2A7A16
card_edge = #8ECF62
card_edge_strong = #D2F5B4
shadow = #00000066
glow = #D8FFB070
glyph = #FFFFFF

# Option chips and switches
chip_on = #3E9A22
chip_off = #1E5A10
chip_off_edge = #6AAE46
switch_off = #245E14

# Background and bars
bar = #1C5E0E
backdrop = #2A7E16
backdrop_stripe = #2A7E16
banner_stripe = #FFFFFF14
# The games' own colours, a little toward the green
banner_tint = #1E6A0E30

# Lists and badges
divider = #5CA63A
scroll_track = #18500E
scroll_thumb = #B8E896
badge = #1E5A10
shelf = #3C9A22
shelf_edge = #1C560E

# Player pointers
pointer1 = #3B8FD6
pointer2 = #E05252
pointer3 = #F2F2F2
pointer4 = #E5AC24
