# Tidepool: the example theme for the RiftWii themes repository.
# Deep teal water, sand-coloured cards and a coral accent.
# Every key is documented in RiftWii's docs/THEMES.md.

[theme]
name = Tidepool
author = RiftWii contributors

[shape]
corners = 1.2
gloss = no
bar = dip
shelf_grain = no

[backdrop]
# background.png replaces the backdrop and its stripes anyway.
stripes = no

[colors]
# Text: on the sand cards and on the dark water both, so the ink is dark
# and the parts drawn straight on the backdrop (clock, dim hints) are light.
ink = #1E3A40
ink_soft = #3D5A5F
ink_dim = #A9C9C6
clock = #D6ECE8
accent = #F0A05C
accent_ink = #A4561C
text_on_accent = #1E3A40
warn = #C0392B

# Tiles, buttons and panels
card = #F6F1E6
card_edge = #D9CDB4
card_edge_strong = #CBBB9A
shadow = #061E2659
glow = #F0A05C60
glyph = #3D5A5F

# Option chips and switches
chip_on = #FBE3CC
chip_off = #EFE8D8
chip_off_edge = #D9CDB4
switch_off = #D9D2C2

# Background and bars
bar = #0B2F3A
backdrop = #0E3A47
backdrop_stripe = #12424F
banner_stripe = #FFFFFF14
banner_tint = #0E3A4733

# Lists and badges
divider = #E4DCC9
scroll_track = #E9E2D2
scroll_thumb = #A89C82
badge = #E9E2D2
shelf = #E9DFC8
shelf_edge = #C9B994
