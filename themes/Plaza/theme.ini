[theme]
name = Plaza
author = RiftWii contributors

[shape]
# Thick, well rounded glossy frames.
corners = 1.3
gloss = yes
bar = dip
shelf_grain = no
home_menu = wii

[backdrop]
# backdrop_00.png to backdrop_35.png: soft pale shapes drift on the white
# wall, 4.5 seconds a loop. RiftWii versions without looping backdrops
# show background.png.
stripes = no
frames = 36
fps = 8

[colors]
# Text: dark grey on white
ink = #333840
ink_soft = #4E5560
ink_dim = #6C737E
clock = #5E6570
# Cyan marks what is lit; dark text on it
accent = #1EB2E8
accent_ink = #0A6E9A
text_on_accent = #062A3C
warn = #C0392B

# Glossy white frames
card = #FFFFFF
card_edge = #C9CED6
card_edge_strong = #AEB5BF
shadow = #3C465024
glow = #1EB2E860
glyph = #5A616C

# Option chips and switches
chip_on = #DDF3FC
chip_off = #F4F6F8
chip_off_edge = #CDD2DA
switch_off = #CDD2DA

# Background and bars
bar = #EEF1F4
backdrop = #F3F5F7
backdrop_stripe = #F3F5F7
banner_stripe = #FFFFFF26
# The games' own colours, kept
banner_tint = #00000000

# Lists and badges
divider = #E3E7EC
scroll_track = #E6E9EE
scroll_thumb = #A9B0BA
badge = #EDF0F3
shelf = #FBFCFD
shelf_edge = #D3D8DF

# Player pointers
pointer1 = #3B8FD6
pointer2 = #D64545
pointer3 = #3FA34D
pointer4 = #D9A21B
